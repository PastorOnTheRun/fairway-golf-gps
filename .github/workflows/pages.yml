name: Publish Fairway

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check JavaScript
        run: |
          node --check dist/app.js
          node --check dist/core.js
          node --check dist/oak-trail.js
          node --check dist/sw.js
      - name: Check GPS calculations and Oak Trail data
        run: node --test tests/core.test.mjs tests/oak-trail.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web app
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
